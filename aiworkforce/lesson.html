<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>บทเรียน | AI Workforce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="learn.css">
</head>
<body>
  <header class="learning-header">
    <a href="index.html"><img src="images/partner-logos.png" alt="AI Workforce"></a>
    <div class="learning-header-actions">
      <a class="back-link" href="javascript:history.back()">← กลับหน้าหลักสูตร</a>
      <button class="btn-login-nav" type="button" onclick="window.openAuthModal()">Login</button>
    </div>
  </header>

  <main class="learning-shell">
    <span class="learning-kicker" id="course-title">COURSE</span>
    <h1 class="learning-title" id="lesson-title">กำลังโหลดบทเรียน…</h1>
    <p class="learning-intro" id="lesson-description"></p>

    <div class="status-panel" id="lesson-status">กำลังตรวจสอบสิทธิ์…</div>
    <section class="lesson-layout" id="lesson-content" hidden>
      <div class="lesson-primary">
        <article class="video-card" id="video-card">
          <div class="video-frame"><div id="youtube-player"></div></div>
        </article>
        <p class="video-unavailable" id="video-unavailable" hidden>วิดีโอยังไม่เผยแพร่ ขณะนี้สามารถอ่านเอกสารประกอบได้</p>
        <section class="materials-panel" id="materials-panel" hidden>
          <h2>เอกสารประกอบ</h2>
          <p>เปิดสไลด์ PDF ใน Google Drive เพื่ออ่านเนื้อหาประกอบบทเรียน</p>
          <div id="materials-list"></div>
        </section>
      </div>
      <aside class="test-panel">
        <h2>แบบทดสอบและกิจกรรม</h2>
        <p class="test-help">ผลแบบทดสอบเก็บใน Google Forms แยกจากความคืบหน้าบนเว็บไซต์ในรอบแรก</p>
        <div id="test-list"></div>
      </aside>
    </section>
  </main>

  <script src="site-config.js?v=20260908-1"></script>
  <script type="module" src="lesson.js"></script>
</body>
</html>
